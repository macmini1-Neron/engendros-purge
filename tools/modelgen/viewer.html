<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>modelgen viewer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #1a1a1e; color: #ddd; }
    #stage { position: fixed; inset: 0 320px 0 0; }
    #canvas { width: 100%; height: 100%; display: block; }
    #overlay { position: absolute; inset: 0; pointer-events: none; opacity: 0; object-fit: contain; width: 100%; height: 100%; }
    #side { position: fixed; top: 0; right: 0; bottom: 0; width: 320px; background: #232329; padding: 10px; overflow: auto; border-left: 1px solid #000; }
    #drop { border: 2px dashed #555; border-radius: 8px; padding: 16px; text-align: center; color: #888; margin-bottom: 10px; }
    #drop.hot { border-color: #d8b15a; color: #d8b15a; }
    #refs img { width: 72px; height: 54px; object-fit: cover; margin: 2px; border: 1px solid #444; cursor: pointer; }
    label { display: block; margin: 8px 0 2px; color: #aaa; }
    input[type=range] { width: 100%; }
    .row { display: flex; gap: 6px; }
    button { background: #3a3a44; color: #ddd; border: 1px solid #000; border-radius: 5px; padding: 5px 8px; cursor: pointer; }
    code { color: #d8b15a; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../../vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <img id="overlay" alt="reference overlay" />
  </div>
  <div id="side">
    <div id="drop">drag &amp; drop reference images here</div>
    <div id="refs"></div>
    <label>overlay opacity</label>
    <input id="op" type="range" min="0" max="1" step="0.01" value="0" />
    <div class="row"><button id="wf">wireframe</button><button id="snap">snapshot</button></div>
    <label>camera az / el / dist</label>
    <div class="row">
      <input id="az" type="range" min="0" max="360" step="1" value="45" />
      <input id="el" type="range" min="-80" max="80" step="1" value="22" />
      <input id="dist" type="range" min="1" max="60" step="0.1" value="4" />
    </div>
    <p>API on <code>window.VIEWER</code>. Drive via Playwright <code>browser_evaluate</code>.</p>
  </div>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
