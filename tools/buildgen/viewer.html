<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>buildgen viewer</title>
  <style>
    body { margin: 0; display: grid; grid-template-columns: 1fr 300px; height: 100vh; background: #14141a; color: #cfd2d8; font: 13px/1.45 system-ui, sans-serif; }
    #canvas { width: 100%; height: 100vh; display: block; }
    #panel { padding: 12px; overflow-y: auto; border-left: 1px solid #2a2a33; }
    h1 { font-size: 14px; margin: 0 0 8px; color: #e8c987; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    button { background: #262633; color: #cfd2d8; border: 1px solid #3a3a48; border-radius: 4px; padding: 4px 9px; cursor: pointer; }
    button:hover { background: #32324233; border-color: #5a5a70; }
    label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    input[type=range] { flex: 1; }
    #drop { border: 2px dashed #3a3a48; border-radius: 6px; padding: 14px; text-align: center; color: #8a8d96; margin: 10px 0; }
    #drop.hot { border-color: #e8c987; color: #e8c987; }
    #refs img { width: 64px; height: 48px; object-fit: cover; margin: 2px; cursor: pointer; border: 1px solid #3a3a48; }
    #overlay { position: fixed; left: 0; top: 0; width: calc(100% - 300px); height: 100vh; object-fit: contain; pointer-events: none; opacity: 0; }
    #info { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px; color: #9fb48f; }
    code { color: #e8c987; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <img id="overlay" alt="" />
  <div id="panel">
    <h1>buildgen viewer</h1>
    <div class="row">
      <button id="snap">snapshot</button><button id="ghostBtn">ghost</button>
      <button id="colBtn">colliders</button><button id="wf">wireframe</button>
    </div>
    <div class="row">
      <button data-view="front">front</button><button data-view="q34">q34</button>
      <button data-view="side">side</button><button data-view="back34">back34</button>
      <button data-view="top">top</button><button data-view="graze">graze</button>
      <button data-view="far300">far300</button><button data-view="door">door</button>
      <button data-view="interior">interior</button>
    </div>
    <label>az <input type="range" id="az" min="0" max="360" value="35" /></label>
    <label>el <input type="range" id="el" min="-10" max="85" value="14" /></label>
    <label>dist <input type="range" id="dist" min="2" max="320" value="18" /></label>
    <label>overlay <input type="range" id="op" min="0" max="1" step="0.05" value="0.5" /></label>
    <div id="drop">drop reference images here<br /><small>(saved to buildings/&lt;id&gt;/ref/ via the dev server)</small></div>
    <div id="refs"></div>
    <p id="info">VIEWER.load('&lt;id&gt;') to begin.</p>
    <p>API on <code>window.VIEWER</code>. Drive via Playwright <code>browser_evaluate</code>; open with <code>?model=&lt;id&gt;&amp;cb=&lt;n&gt;</code>.</p>
  </div>
  <script type="importmap">
    { "imports": { "three": "../../vendor/three.module.min.js" } }
  </script>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
