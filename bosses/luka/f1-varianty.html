<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Luka – fáze 1: varianty útoku „Oslíčku, otřes se!" (A / B / C)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0c; overflow:hidden; font-family:monospace; }
  canvas { display:block; }
  #info { position:fixed; top:12px; left:50%; transform:translateX(-50%);
    color:#dfe; font-size:13px; background:rgba(0,0,0,.55); padding:7px 16px;
    border-radius:8px; pointer-events:none; text-align:center; line-height:1.5; }
</style>
</head>
<body>
<div id="info">LUKA · fáze 1 — „Oslíčku, otřes se!" · 3 varianty útoku k výběru<br>
A = otřesová sprcha (fontána) · B = otřepání po dávkách · C = vysypání k nohám · (modely přímo z .js)</div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
class MeshBuilder {
  constructor() { this._pos=[]; this._nor=[]; this._col=[]; this._idx=[]; this._vc=0; }
  _apply(geo, x, y, z, { rx=0, ry=0, rz=0, align=null } = {}) {
    const g = geo.clone();
    if (rx) g.rotateX(rx); if (ry) g.rotateY(ry); if (rz) g.rotateZ(rz);
    if (align) { const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), align.clone().normalize()); g.applyQuaternion(q); }
    g.translate(x, y, z); if (!g.attributes.normal) g.computeVertexNormals(); return g;
  }
  _push(geo, color) { const pos=geo.attributes.position, nor=geo.attributes.normal, idx=geo.index;
    const r=((color>>16)&0xff)/255, g=((color>>8)&0xff)/255, b=(color&0xff)/255;
    for (let i=0;i<pos.count;i++){ this._pos.push(pos.getX(i),pos.getY(i),pos.getZ(i)); this._nor.push(nor.getX(i),nor.getY(i),nor.getZ(i)); this._col.push(r,g,b); }
    if (idx){ for(let i=0;i<idx.count;i++) this._idx.push(this._vc+idx.getX(i)); } else { for(let i=0;i<pos.count;i++) this._idx.push(this._vc+i); }
    this._vc += pos.count; }
  box(w,h,d, x,y,z, color, opts={}) { const g=this._apply(new THREE.BoxGeometry(w,h,d), x,y,z, opts); this._push(g,color); g.dispose(); }
  geo(geometry, x,y,z, color, opts={}) { const g=this._apply(geometry, x,y,z, opts); this._push(g,color); g.dispose(); }
  build() { const bg=new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.Float32BufferAttribute(this._pos,3));
    bg.setAttribute('normal',   new THREE.Float32BufferAttribute(this._nor,3));
    bg.setAttribute('color',    new THREE.Float32BufferAttribute(this._col,3));
    bg.setIndex(new THREE.Uint32BufferAttribute(this._idx,1));
    return new THREE.Mesh(bg, new THREE.MeshLambertMaterial({ vertexColors:true })); }
}
</script>
<script src="luka-fn.js"></script>
<script src="coin.js"></script>

<script>
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0a0c); scene.fog = new THREE.Fog(0x0a0a0c, 18, 44);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 100); camera.position.set(0, 1.4, -11);
const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.1, 0); controls.enableDamping = true; controls.update();
scene.add(new THREE.AmbientLight(0xffffff, 0.95));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.2); sun.position.set(-2, 5, -3); scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5); fill.position.set(3, 1, -4); scene.add(fill);
const grid = new THREE.GridHelper(40, 40, 0x3a3a3e, 0x222226); grid.position.y = -0.62; scene.add(grid);
function label(text, px, py){ const c=document.createElement('canvas');c.width=420;c.height=64;const g=c.getContext('2d');
  g.font='bold 28px monospace';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#cfe9cf';g.fillText(text,210,32);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  s.scale.set(2.6,0.4,1);s.position.set(px,py,0);scene.add(s); }
function propMesh(fn){ const b=new MeshBuilder(); fn(b); return b.build(); }

const SPACING=4.3, SC=1.55, GROUND=-0.40;
const BODY = new THREE.Vector3(0, -0.05, -0.05);   // odkud se peníze sypou (z těla)

// mince (zlaté – „poklad") – šablona + klony
const coinT = propMesh(b => buildCoin(b, 0,0,0, 0.2, 'gold'));
function coinClone(){ const m=coinT.clone(); m.visible=false; return m; }

function makeLuka(px, l1, l2){
  const grp=new THREE.Group(); grp.position.set(px,0,0); grp.scale.setScalar(SC);
  const fig=new THREE.Group(); grp.add(fig);
  fig.add(propMesh(b=>buildLuka(b,{noDollar:true})));
  const dollar=propMesh(b=>buildLukaDollar(b)); dollar.material=dollar.material.clone(); dollar.material.color.setHex(0xE8C84A); fig.add(dollar);
  const coins=[]; for(let i=0;i<46;i++){ const m=coinClone(); grp.add(m); coins.push({m,vx:0,vy:0,vz:0,life:0,grounded:false,rest:0}); }
  scene.add(grp); label(l1,px,1.62); label(l2,px,1.26);
  return { grp, fig, coins, t:0 };
}
function spawn(L, vx,vy,vz){ const c=L.coins.find(o=>o.life<=0); if(!c) return;
  c.m.position.set(BODY.x+(Math.random()-0.5)*0.18, BODY.y+(Math.random()-0.5)*0.18, BODY.z); c.m.rotation.set(Math.random()*3,Math.random()*3,0);
  c.vx=vx; c.vy=vy; c.vz=vz; c.grounded=false; c.rest=0; c.life=3.2; c.m.visible=true; }
function stepCoins(L, dt){
  for(const c of L.coins){ if(c.life<=0) continue; c.life-=dt;
    if(!c.grounded){ c.vy-=6.2*dt; c.m.position.x+=c.vx*dt; c.m.position.y+=c.vy*dt; c.m.position.z+=c.vz*dt;
      c.m.rotation.x+=dt*11; c.m.rotation.y+=dt*8;
      if(c.m.position.y<=GROUND && c.vy<0){ c.m.position.y=GROUND; c.grounded=true; c.rest=1.4+Math.random()*1.0; } }
    else { c.vx*=0.86; c.vz*=0.86; c.m.position.x+=c.vx*dt; c.m.position.z+=c.vz*dt;
      c.m.rotation.x += (Math.PI/2 - c.m.rotation.x)*Math.min(1,dt*8);   // dolehne naplocho
      c.rest-=dt; if(c.rest<=0){ c.life=0; c.m.visible=false; } } }
}
// otřes: kývání rotace + poskok + lehké zploštění; amp 0..1
function shake(L, amp){ const n=performance.now();
  L.fig.rotation.z = Math.sin(n*0.045)*0.14*amp;
  L.fig.rotation.x = Math.sin(n*0.037)*0.06*amp;
  L.fig.position.y = Math.abs(Math.sin(n*0.05))*0.05*amp;
  L.fig.scale.set(1+0.05*amp*Math.sin(n*0.05), 1-0.05*amp*Math.sin(n*0.05), 1);
}

// ═══ VARIANTA A — otřesová sprcha (fontána): dlouhý otřes + nepřetržitý déšť mincí ═══
const A = makeLuka(SPACING, 'VARIANTA A', 'otřesová sprcha (fontána)');
let aEmit=0;
function updA(dt){ A.t+=dt; const T=A.t%3.4, on=T<2.3;          // 2.3 s třese, pak pauza
  shake(A, on?1:Math.max(0,1-(T-2.3)*4));
  if(on){ aEmit-=dt; if(aEmit<=0){ aEmit=0.05;                    // hustý déšť
    const a=Math.random()*Math.PI*2, r=0.6+Math.random()*1.0;
    spawn(A, Math.cos(a)*r, 1.8+Math.random()*1.3, Math.sin(a)*r); } }
  stepCoins(A, dt);
}

// ═══ VARIANTA B — otřepání po dávkách (mokrý pes): 3 trhnutí, každé vystřelí várku ═══
const B = makeLuka(0, 'VARIANTA B', 'otřepání po dávkách');
let bLast=-1;
function updB(dt){ B.t+=dt; const T=B.t%3.4;
  const beats=[0.2,1.1,2.0]; let amp=0, idx=-1;
  beats.forEach((bt,i)=>{ const d=T-bt; if(d>=0&&d<0.45){ amp=Math.max(amp,1-d/0.45); idx=i; } });
  shake(B, amp);
  if(idx!==bLast && idx>=0){ bLast=idx;                          // nová várka
    for(let k=0;k<10;k++){ const a=k/10*Math.PI*2+Math.random()*0.3;
      spawn(B, Math.cos(a)*(1.4+Math.random()*0.8), 1.2+Math.random()*0.6, Math.sin(a)*(1.4+Math.random()*0.8)); } }
  if(idx<0) bLast=-1;
  stepCoins(B, dt);
}

// ═══ VARIANTA C — vysypání k nohám: krátký otřes, mince spadnou dolů a rozkutálí se ═══
const C = makeLuka(-SPACING, 'VARIANTA C', 'vysypání k nohám');
let cDone=false;
function updC(dt){ C.t+=dt; const T=C.t%3.4, on=T<0.8;
  shake(C, on?1:0);
  if(on && !cDone && T>0.25){ cDone=true;                         // jednorázové vysypání dolů
    for(let k=0;k<18;k++){ const a=k/18*Math.PI*2+Math.random()*0.4;
      spawn(C, Math.cos(a)*(0.5+Math.random()*0.5), 0.4+Math.random()*0.4, Math.sin(a)*(0.5+Math.random()*0.5)); } }
  if(T>0.8) cDone=false;
  stepCoins(C, dt);
}

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{ const dt=Math.min(clock.getDelta(),0.05); updA(dt); updB(dt); updC(dt); controls.update(); renderer.render(scene,camera); });
window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
window.__ready=true;
</script>
</body>
</html>
