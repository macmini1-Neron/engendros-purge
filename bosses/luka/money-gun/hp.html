<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><title>Money Gun – HIGH POLY (stavba po dílech)</title>
<style>*{margin:0}body{background:#15110a;overflow:hidden}canvas{display:block}
#lbl{position:fixed;left:12px;top:10px;font:600 14px system-ui;color:#d8c79a;letter-spacing:.04em}</style></head>
<body>
<div id="lbl">MONEY GUN — high poly · DÍL 1: ÚCHYT (madlo)</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ═══════════════ SCÉNA / RENDERER ═══════════════
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(900,900);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x15110a);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38,1,0.01,100);
camera.position.set(2.0,0.0,2.4); camera.lookAt(0,-0.22,0.18);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,-0.22,0.18); controls.update();

scene.add(new THREE.AmbientLight(0xffffff,0.42));
const key=new THREE.DirectionalLight(0xfff2d8,2.7); key.position.set(3,5,4); scene.add(key);
const top=new THREE.DirectionalLight(0xfff6e2,1.1); top.position.set(0,6,0.5); scene.add(top);
const rim=new THREE.DirectionalLight(0x99aaff,0.9); rim.position.set(-4,2,-3); scene.add(rim);

// ═══════════════ MATERIÁLY ═══════════════
const gold = new THREE.MeshStandardMaterial({ color:0xCFA72E, metalness:0.95, roughness:0.25, envMapIntensity:1.6, emissive:0x1a1304, emissiveIntensity:0.12 });
const goldD= new THREE.MeshStandardMaterial({ color:0x8A6A16, metalness:0.95, roughness:0.35, envMapIntensity:1.2 });
const ivory= new THREE.MeshStandardMaterial({ color:0xF1E9D2, metalness:0.0, roughness:0.40, envMapIntensity:0.5 }); // teplá slonovina/email
// DŘEVO – tmavé skoro černo-hnědé, lesklý lak (varnish)
const wood = new THREE.MeshStandardMaterial({ color:0x2E1B0C, metalness:0.0, roughness:0.30, envMapIntensity:0.75 });
const woodHi=new THREE.MeshStandardMaterial({ color:0x4A2E14, metalness:0.0, roughness:0.28, envMapIntensity:0.75 });
const woodLo=new THREE.MeshStandardMaterial({ color:0x180C03, metalness:0.0, roughness:0.36, envMapIntensity:0.70 });
const dark = new THREE.MeshStandardMaterial({ color:0x140F08, metalness:0.4, roughness:0.5, envMapIntensity:0.6 });
const copper=new THREE.MeshStandardMaterial({ color:0xC0712A, metalness:0.85, roughness:0.38, envMapIntensity:1.1 });

// ═══════════════ HELPER ═══════════════
const gun = new THREE.Group();
const add=(geo,mat,x,y,z,opts={})=>{ const me=new THREE.Mesh(geo,mat); me.position.set(x,y,z);
  if(opts.rx)me.rotation.x=opts.rx; if(opts.ry)me.rotation.y=opts.ry; if(opts.rz)me.rotation.z=opts.rz;
  if(opts.sx||opts.sy||opts.sz)me.scale.set(opts.sx||1,opts.sy||1,opts.sz||1);
  gun.add(me); return me; };
// prstenec kolmý na páteř v parametru t (osa torusu = tečna křivky)
const ringAt=(curve,t,tubeR,col,sx=0.81)=>{ const p=curve.getPoint(t), T=curve.getTangent(t);
  const alpha=Math.atan2(-T.y,T.z); const rr=radAt(t)+tubeR*0.6;
  return add(new THREE.TorusGeometry(rr,tubeR,16,48), col, p.x,p.y,p.z, {rx:alpha, sx}); };

// ═══════════════════════════════════════════════════════════════════
//  DÍL 1 — ÚCHYT / MADLO
//  Korpus = JEDNA hladká plocha: swept tube s proměnným poloměrem podél
//  zahnuté páteře (high-poly). ČTVEREC = závěr nahoře. KRUŽNICE = zlatý
//  prstenec na krčku. KOULE = pommel (zakončení pažby).
//  Konvence: ústí = −Z, nahoru = +Y, pažba klesá dozadu (+Z) a dolů (−Y).
// ═══════════════════════════════════════════════════════════════════

// --- generátor: trubice s proměnným poloměrem podél křivky (úsek t0..t1) ---
function variTube(curve, radFn, t0, t1, tub=140, rad=40){
  const frames = curve.computeFrenetFrames(tub, false);
  const pos=[], nor=[], idx=[];
  for (let i=0;i<=tub;i++){
    const ft = i/tub, t = t0 + (t1-t0)*ft;
    const p = curve.getPoint(t);
    const N = frames.normals[Math.round(ft*tub)] || frames.normals[i];
    const B = frames.binormals[Math.round(ft*tub)] || frames.binormals[i];
    const r = radFn(t);
    for (let j=0;j<=rad;j++){
      const a = j/rad*Math.PI*2, c=Math.cos(a), s=Math.sin(a);
      const nx=c*N.x+s*B.x, ny=c*N.y+s*B.y, nz=c*N.z+s*B.z;
      pos.push(p.x+r*nx, p.y+r*ny, p.z+r*nz); nor.push(nx,ny,nz);
    }
  }
  for (let i=1;i<=tub;i++) for (let j=1;j<=rad;j++){
    const a=(rad+1)*(i-1)+(j-1), b=(rad+1)*i+(j-1), cc=(rad+1)*i+j, d=(rad+1)*(i-1)+j;
    idx.push(a,b,d, b,cc,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  g.setIndex(idx); return g;
}

// helper: extrude YZ-profilu v ose X se zaoblením (rotace + vycentrování)
function extrudeYZ(shape, mat, TH, bevel=0.055){
  const g=new THREE.ExtrudeGeometry(shape,{depth:TH,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel,bevelSegments:6,curveSegments:32});
  const m=add(g, mat, 0,0,0, {ry:-Math.PI/2}); m.position.x = TH/2; return m;
}

// ═══ KORPUS PAŽBY = zaoblená tuba, tvar 1:1 dle „KAPITALISTA" ═══
//   plný banán, lehce raked dozadu, patka se stáčí DOZADU a fléruje do butt-capu
const spine = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,  0.06, -0.10),  // krček u zámku
  new THREE.Vector3(0, -0.08, -0.02),
  new THREE.Vector3(0, -0.22,  0.055),
  new THREE.Vector3(0, -0.35,  0.115), // bříško/záda swell
  new THREE.Vector3(0, -0.46,  0.165), // patka se stáčí dozadu
  new THREE.Vector3(0, -0.535, 0.205), // konec pažby (butt cap)
], false, 'catmullrom', 0.5);
const radAt = (t)=>{
  if (t < 0.20) return 0.085 + t/0.20*0.046;            // krček 0.085 → 0.131 (plný)
  if (t < 0.70) return 0.131 + (t-0.20)/0.50*0.018;     // bříško 0.131 → 0.149
  return 0.149 + (t-0.70)/0.30*0.012;                   // fléruje do patky 0.149 → 0.161
};
const body = add(variTube(spine, radAt, 0.02, 0.95, 180, 44), wood, 0,0,0, {sx:0.80});

// ═══ ZÁMEK = z půlky DŘEVO (pod kohoutkem = pokračování rukojeti),
//     z půlky ZLATÝ KVÁDR vepředu (napojí se na hlaveň) ═══
// (A) DŘEVĚNÝ wrist pod kohoutkem (zadní část) — rukojeť pokračuje nahoru
add(new THREE.BoxGeometry(0.175,0.27,0.205), wood,   0, 0.070, 0.050, {sx:0.84});
add(new THREE.BoxGeometry(0.150,0.026,0.210), woodHi, 0, 0.203, 0.050, {sx:0.84}); // hi temeno
add(new THREE.BoxGeometry(0.150,0.026,0.210), woodLo, 0,-0.062, 0.050, {sx:0.84}); // lo spodek
// (B) ZLATÝ KVÁDR (breech) vepředu — přední čelo (−Z) se napojí na HLAVEŇ
add(new THREE.BoxGeometry(0.180,0.205,0.450), gold,  0, 0.100,-0.250, {sx:0.86});
add(new THREE.BoxGeometry(0.160,0.024,0.460), gold,  0, 0.205,-0.250, {sx:0.86}); // hi temeno
add(new THREE.BoxGeometry(0.160,0.024,0.460), goldD, 0,-0.004,-0.250, {sx:0.86}); // lo spodek
// úzký zlatý lem na rozhraní dřevo↔zlato
add(new THREE.BoxGeometry(0.185,0.215,0.028), gold,  0, 0.100,-0.030, {sx:0.86});
// OZDOBA KRYCHLE: zaoblené hranové lišty + přední rohové voluty
for (const sgn of [1,-1]){
  add(new THREE.CylinderGeometry(0.012,0.012,0.45,16), goldD, sgn*0.075,0.198,-0.25, {rx:Math.PI/2}); // horní boční hrana
  add(new THREE.CylinderGeometry(0.012,0.012,0.45,16), goldD, sgn*0.075,0.003,-0.25, {rx:Math.PI/2}); // dolní boční hrana
  for (const sy of [1,-1])                                                                             // rohové voluty vepředu
    add(new THREE.TorusGeometry(0.026,0.007,10,20,Math.PI*1.4), gold, sgn*0.080, 0.10+sy*0.072, -0.455, {ry:Math.PI/2, rz: sy>0?0.5:-0.5});
}

// (prstenec na krčku ZRUŠEN — 26457 ho nemá; místo něj později rytý scroll)

// ═══ LUČÍK (swept-tube oblouk) + SPOUŠŤ — větší, čistý ═══
const guardCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,  0.045, -0.34),  // přední úchyt k zámku
  new THREE.Vector3(0, -0.08,  -0.345),
  new THREE.Vector3(0, -0.17,  -0.275), // dno oblouku
  new THREE.Vector3(0, -0.185, -0.18),
  new THREE.Vector3(0, -0.165, -0.085),
  new THREE.Vector3(0, -0.075, -0.02),  // zadní úchyt k přední straně gripu
], false, 'catmullrom', 0.5);
add(variTube(guardCurve, ()=>0.020, 0.0, 1.0, 90, 20), gold, 0,0,0);
// kořeny lučíku (kde se uchycuje k zámku)
add(new THREE.SphereGeometry(0.03,18,14), goldD, 0, 0.05, -0.34);
add(new THREE.SphereGeometry(0.03,18,14), goldD, 0,-0.07, -0.015);
// SPOUŠŤ: zahnutá čepel uvnitř lučíku (větší)
add(new THREE.BoxGeometry(0.028,0.14,0.034), dark, 0,-0.05,-0.225, {rx:0.5, sx:0.9});
add(new THREE.SphereGeometry(0.024,16,12), dark, 0,-0.115,-0.255); // zaoblený dolní konec spouště

// ═══ KOHOUTEK / KŘESADLO (flintlock cock) — na PRAVÉ (+X) straně zlaté krychle ═══
const CX = 0.090;   // posun na pravý bok krychle (zámková deska)
// zámková deska (lock plate) na +X boku
add(new THREE.SphereGeometry(0.135,30,22), gold, CX-0.020,0.27,-0.095, {sx:0.16, sy:1.0, sz:0.62});
add(new THREE.SphereGeometry(0.122,28,20), goldD, CX-0.010,0.27,-0.095, {sx:0.14, sy:1.0, sz:0.62});
const cockCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 0.215,-0.020),  // pivot
  new THREE.Vector3(0, 0.305, 0.030),  // S se stáčí dozadu
  new THREE.Vector3(0, 0.385, 0.000),
  new THREE.Vector3(0, 0.435,-0.065),  // a zpět dopředu
  new THREE.Vector3(0, 0.455,-0.125),  // ke křemeni
], false, 'catmullrom', 0.5);
add(variTube(cockCurve, (t)=>0.032-0.009*t, 0,1, 70, 18), gold, CX,0,0, {sx:0.7});
// pivot/čep
add(new THREE.CylinderGeometry(0.030,0.030,0.07,20), goldD, CX,0.215,-0.020, {rz:Math.PI/2});
add(new THREE.CylinderGeometry(0.013,0.013,0.10,12), gold, CX,0.215,-0.020, {rz:Math.PI/2}); // hlava šroubu
// horní čelisti drží KŘEMEN (flint)
add(new THREE.BoxGeometry(0.06,0.05,0.062), goldD, CX,0.452,-0.130, {rx:-0.5, sx:0.9}); // spodní čelist
add(new THREE.BoxGeometry(0.045,0.05,0.05), dark, CX,0.475,-0.165, {rx:-0.5});          // KŘEMEN
add(new THREE.BoxGeometry(0.06,0.045,0.062), gold, CX,0.498,-0.197, {rx:-0.5, sx:0.9}); // horní čelist
add(new THREE.CylinderGeometry(0.014,0.014,0.075,12), gold, CX,0.475,-0.165, {rx:-0.5, rz:Math.PI/2}); // šroub čelisti
// FRIZZEN (ocílka) + pánvička před kohoutkem
add(new THREE.BoxGeometry(0.055,0.14,0.03), gold, CX-0.005,0.305,-0.190, {rx:0.45, sx:0.9});
add(new THREE.BoxGeometry(0.055,0.03,0.07), goldD, CX-0.010,0.235,-0.170);              // pánvička
// (HLAVEŇ odebrána — nejdřív dokončit rukojeť/madlo + ozdobnou krychli)

// ══════════ ORNAMENT (dle instrukcí: inlay panel + filigrán + medailon + butt-cap) ══════════
// side X-povrch rukojeti v parametru t (sx grip = 0.80)
const sideX = (t)=> radAt(t)*0.80;

// (1) SLONOVINOVÝ INLAY PANEL podél boku + zlatý lem (raised trim) – řada čoček
{ const N=24;
  for (let i=0;i<=N;i++){
    const t=0.15+(0.82-0.15)*i/N, p=spine.getPoint(t), r=sideX(t);
    for (const sgn of [1,-1]){
      add(new THREE.SphereGeometry(0.092,20,14), gold,  sgn*(r-0.004), p.y,p.z, {sx:0.26}); // zlatý lem (podklad)
      add(new THREE.SphereGeometry(0.064,20,14), ivory, sgn*(r+0.010), p.y,p.z, {sx:0.24}); // slonovinový panel (raised)
    }
  }
}
// (2) ZLATÉ VINUTÍ / borders – korálkové linky podél předního a zadního okraje panelu
for (const sgn of [1,-1]){
  const N=28;
  for (let i=0;i<=N;i++){
    const t=0.13+(0.87-0.13)*i/N, p=spine.getPoint(t), r=sideX(t), e=radAt(t)*0.74;
    add(new THREE.SphereGeometry(0.013,10,8), goldD, sgn*(r+0.014), p.y, p.z - e, {});
    add(new THREE.SphereGeometry(0.013,10,8), goldD, sgn*(r+0.014), p.y, p.z + e, {});
  }
}
// (3) FILIGRÁN – HUSTÝ zlatý baroque scroll na panelu (raised, symetrický)
{ const M=13;
  for (let i=0;i<M;i++){
    const t=0.175+(0.80-0.175)*i/(M-1);
    if (Math.abs(t-0.56)<0.08) continue;                 // vynech místo medailonu
    const p=spine.getPoint(t), r=sideX(t);
    for (const sgn of [1,-1]){
      for (const dz of [-0.058,0.058]){                  // přední/zadní – baroque symetrie
        const dir = dz<0 ? 1 : -1;
        const rot = dir*1.25 + (i%2)*0.55;
        const arc = (i%3===0)?Math.PI*1.7:Math.PI*1.25;
        add(new THREE.TorusGeometry(0.027,0.0052,8,22,arc), gold,
          sgn*(r+0.017), p.y, p.z+dz, {ry:sgn>0?Math.PI/2:-Math.PI/2, rz:rot});
        add(new THREE.ConeGeometry(0.011,0.030,6), goldD,  // lístek/úponek
          sgn*(r+0.015), p.y, p.z+dz*1.38, {ry:sgn>0?Math.PI/2:-Math.PI/2, rz:rot+1.1});
      }
    }
  }
  // centrální zlatý úponek (stonek) po délce panelu
  const N2=22;
  for (let i=0;i<=N2;i++){ const t=0.17+(0.80-0.17)*i/N2; if(Math.abs(t-0.56)<0.08) continue;
    const p=spine.getPoint(t), r=sideX(t);
    for (const sgn of [1,-1]) add(new THREE.SphereGeometry(0.009,8,8), gold, sgn*(r+0.020),p.y,p.z,{}); }
}
// (4) $ MEDAILON na boku (lower-middle) + zlaté lístky kolem
{ const t=0.56, p=spine.getPoint(t), r=sideX(t);
  for (const sgn of [1,-1]){
    const mx=sgn*(r+0.014), my=p.y, mz=p.z;
    for (const ang of [0.4,1.7,3.0,4.3,5.6]){                                     // zlaté lístky kolem
      const lz=mz+Math.cos(ang)*0.098, ly=my+Math.sin(ang)*0.098;
      add(new THREE.ConeGeometry(0.020,0.052,8), goldD, mx-sgn*0.004,ly,lz, {ry:sgn>0?Math.PI/2:-Math.PI/2, rz:ang+Math.PI/2});
    }
    add(new THREE.CylinderGeometry(0.072,0.072,0.018,40), gold, mx,my,mz, {rz:Math.PI/2});      // disk
    add(new THREE.TorusGeometry(0.072,0.011,14,40), goldD, mx+sgn*0.004,my,mz, {ry:Math.PI/2});  // lem
    add(new THREE.BoxGeometry(0.012,0.078,0.012), gold, mx+sgn*0.012,my,mz-0.013);               // $ čárka 1
    add(new THREE.BoxGeometry(0.012,0.078,0.012), gold, mx+sgn*0.012,my,mz+0.013);               // $ čárka 2
    add(new THREE.TorusGeometry(0.021,0.007,10,20,Math.PI*1.5), gold, mx+sgn*0.012,my+0.022,mz, {ry:sgn>0?Math.PI/2:-Math.PI/2});
    add(new THREE.TorusGeometry(0.021,0.007,10,20,Math.PI*1.5), gold, mx+sgn*0.012,my-0.022,mz, {ry:sgn>0?Math.PI/2:-Math.PI/2, rz:Math.PI});
  }
}
// (5) VRSTVENÝ BUTT-CAP – kupole + prstencové bandy + cvoček
const pE = spine.getPoint(0.965);
add(new THREE.SphereGeometry(0.160,44,32), gold, pE.x, pE.y-0.005, pE.z+0.015, {sx:0.80, sz:0.96}); // kupole
ringAt(spine, 0.83, 0.020, goldD); ringAt(spine, 0.90, 0.018, goldD);                               // 2 bandy nad patkou
add(new THREE.TorusGeometry(0.118,0.015,14,40), goldD, pE.x,pE.y+0.015,pE.z+0.01, {rx:0.5, sx:0.82}); // band na kupoli
add(new THREE.SphereGeometry(0.050,24,18), goldD, pE.x, pE.y-0.108, pE.z+0.05, {sx:0.82});           // cvoček

// (6) HORNÍ ZLATÁ DESKA (breech) – ryté borders + kruhový šroub/mince
for (const sgn of [1,-1]){
  const px=sgn*(0.18*0.86/2);
  add(new THREE.BoxGeometry(0.006,0.15,0.008), goldD, px,0.10,-0.065);    // rámeček: zadní svislá
  add(new THREE.BoxGeometry(0.006,0.15,0.008), goldD, px,0.10,-0.440);    // přední svislá
  add(new THREE.BoxGeometry(0.006,0.008,0.39), goldD, px,0.178,-0.252);   // horní
  add(new THREE.BoxGeometry(0.006,0.008,0.39), goldD, px,0.022,-0.252);   // dolní
  add(new THREE.CylinderGeometry(0.044,0.044,0.014,30), goldD, px+sgn*0.004,0.105,-0.30, {rz:Math.PI/2}); // šroub/mince
  add(new THREE.TorusGeometry(0.044,0.006,10,28), gold, px+sgn*0.008,0.105,-0.30, {ry:Math.PI/2});
  add(new THREE.BoxGeometry(0.009,0.052,0.009), wood, px+sgn*0.012,0.105,-0.30, {rz:0.6});            // slot šroubu
}

scene.add(gun);
window.GUN=gun; window.CAM=camera; window.RENDER=()=>renderer.render(scene,camera);
renderer.render(scene,camera);
controls.addEventListener('change',()=>renderer.render(scene,camera));
window.__ready=true;
</script>
</body></html>
