<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ENGENDROS — Asset Preview</title>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <style>
    :root { --bg:#14171c; --panel:#1b1f26; --line:#2b313b; --txt:#d7dce3; --dim:#8b94a2; --acc:#c9a04a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt);
      font-family: 'Russo One', system-ui, sans-serif; letter-spacing: .02em; }
    #app { display: flex; height: 100vh; }

    /* sidebar list */
    #side { width: 248px; min-width: 248px; background: var(--panel); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; }
    #side h1 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--acc);
      margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    #backToGame { font-size: 11px; letter-spacing: .06em; color: var(--dim); text-decoration: none;
      border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; }
    #backToGame:hover { color: var(--txt); border-color: var(--acc); }
    #list { overflow-y: auto; flex: 1; padding: 6px; }
    .ap-item { display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 6px; cursor: pointer; color: var(--txt); }
    .ap-item:hover { background: #232833; }
    .ap-item.sel { background: #2e2616; outline: 1px solid var(--acc); }
    .ap-item.pinned { background: #2a2414; }
    .ap-item.pinned.sel { background: #3a2e16; }
    .ap-name { flex: 1; font-size: 13px; }
    .ap-cls { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
    .ap-pin { background: none; border: 0; padding: 0; cursor: pointer; font-size: 12px; line-height: 1;
      filter: grayscale(1); opacity: .3; transition: opacity .12s, filter .12s; }
    .ap-item:hover .ap-pin { opacity: .6; }
    .ap-item.pinned .ap-pin { filter: none; opacity: 1; }
    .ap-divider { font-size: 9px; letter-spacing: .1em; color: var(--dim); opacity: .65;
      text-transform: uppercase; padding: 8px 12px 4px; }

    /* main stage */
    #main { flex: 1; position: relative; }
    #view { width: 100%; height: 100%; display: block; cursor: grab; }
    #view:active { cursor: grabbing; }

    /* top control bar */
    #bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 18px;
      padding: 10px 16px; background: linear-gradient(#14171ccc, #14171c00); pointer-events: none; }
    #bar > * { pointer-events: auto; }
    #title { display: flex; flex-direction: column; }
    #curName { font-size: 15px; color: #fff; }
    #curInfo { font-size: 10px; color: var(--dim); }
    .ctl { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim); }
    .ctl input[type=range] { width: 120px; accent-color: var(--acc); }
    .switch { position: relative; width: 38px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #39404c; border-radius: 20px; transition: .15s; cursor: pointer; }
    .slider::before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; top: 3px;
      background: #cdd3db; border-radius: 50%; transition: .15s; }
    .switch input:checked + .slider { background: var(--acc); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    #reset { pointer-events: auto; background: #232833; color: var(--txt); border: 1px solid var(--line);
      border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; }
    #reset:hover { border-color: var(--acc); }
    #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: var(--dim); background: #1b1f26aa; padding: 5px 12px; border-radius: 6px;
      white-space: nowrap; }
    .spacer { flex: 1; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="side">
      <h1>Asset Preview <a id="backToGame" href="./index.html" title="Back to the game">‹ GAME</a></h1>
      <div id="list"></div>
    </aside>
    <div id="main">
      <canvas id="view"></canvas>
      <div id="bar">
        <div id="title"><span id="curName">—</span><span id="curInfo"></span></div>
        <div class="spacer"></div>
        <label class="ctl">SPIN
          <span class="switch"><input type="checkbox" id="spin" checked /><span class="slider"></span></span>
        </label>
        <label class="ctl">SENS
          <input type="range" id="sens" min="0.15" max="2" step="0.05" value="1" />
          <span id="sensv">1.00×</span>
        </label>
        <button id="reset">RESET VIEW</button>
      </div>
      <div id="hint">drag = orbit · shift/right-drag = pan · wheel = zoom</div>
    </div>
  </div>
  <script type="module" src="./src/assetpreview.js?v=3"></script>
</body>
</html>
